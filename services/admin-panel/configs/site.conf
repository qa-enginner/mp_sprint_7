server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    
    root /data;
    index index.html;

    # Backend upstream (use service name, not IP)
    location @backend {
        proxy_pass http://admin-panel:8000;
        proxy_set_header X-Request-Id $request_id;
        # Headers are already set in http block, but can override if needed
    }

    # Static files
    location ~* \.(jpg|jpeg|gif|png|ico|css|js)$ {
        root /data;
        expires 90d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    location /static/ {
        alias /data/static/;
        expires 30d;
    }

    # API and admin routes
    location ~ ^/(api|admin) {
        try_files $uri @backend;
    }

    # Default route
    location / {
        try_files $uri @backend;
    }

    # Error pages - FIX: absolute path to default Nginx html dir
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;  # This directory exists in default Nginx image
        internal;
    }
}